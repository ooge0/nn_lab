[tool.black]
line-length = 120
extend-exclude = '''
(
    ^/legacy/
    | ^/streamlit_app_\.py$
    | ^/streamlit_app_lang_localization\.py$
    | ^/tmp/
    | ^/core/tabs/knowledge_graph\.py$
    | ^/core/service/
    | ^/utils/other/neo4j_services\.py$
    | ^/\.venv\.old-bak/
)
'''

[tool.ruff]
line-length = 120
exclude = [
    "legacy",
    "streamlit_app_.py",
    "streamlit_app_lang_localization.py",
    "tmp",
    "core/tabs/knowledge_graph.py",
    "core/service",
    "utils/other/neo4j_services.py",
    ".venv.old-bak",
]

[tool.mypy]
explicit_package_bases = true
exclude = [
    "legacy/",
    "streamlit_app_\\.py",
    "streamlit_app_lang_localization\\.py",
    "^tmp/",
    "core/tabs/knowledge_graph\\.py",
    "core/service/",
    "utils/other/neo4j_services\\.py",
    "\\.venv\\.old-bak/",
]

# Third-party libraries with no bundled type stubs and no stub package pursued -- see
# CLAUDE.md's "found after the fact" log (2026-08-21, Stage 6): treated as a real, disclosed,
# advisory-only gap, not suppressed silently. Installing a `types-*` stub package per library is
# disproportionate for an advisory-only finding on dependencies this project doesn't control.
[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "textblob.*",
    "plotly.*",
    "py2neo.*",
    "networkx.*",
    "pyvis.*",
    "hdbscan.*",
    "umap.*",
    "tqdm.*",
    "sklearn.*",
    "textdescriptives.*",
    "wordcloud.*",
]
ignore_missing_imports = true

# core/adapters/rag/{vector_store,ingestion}.py -- pre-existing typing gaps (implicit-Optional
# params, a None-initialized attribute later reassigned a real type), found during Stage 3's port
# and explicitly left unfixed at the time: Stage 3's mandate was to relocate this code as-is
# ("core/rag/" -> "core/adapters/rag/"), not to improve it, and RAGEngine itself was moved
# "essentially as-is" per CLAUDE.md's own record of that decision. Scoped out here rather than
# fixed, so a real `mypy` run stays clean without silently re-deciding a call already made.
[[tool.mypy.overrides]]
module = "core.adapters.rag.vector_store"
ignore_errors = true

[[tool.mypy.overrides]]
module = "core.adapters.rag.ingestion"
ignore_errors = true
