[tox]
# List of all target environments
envlist = py312, linux, win32
isolated_build = true

# skip_install: this project is an application, not an installable library -- tests reach it via
# tests/conftest.py inserting the repo root onto sys.path, never via `pip install -e .`. Needed as
# of the pyproject.toml added for ruff/mypy config (SS11's lint/type-check gap): tox's
# isolated_build now tries to build this project as a wheel for every env, and setuptools' package
# auto-discovery fails outright on this repo's flat, 12-top-level-directory layout
# ("Multiple top-level packages discovered"). skip_install sidesteps that build entirely rather
# than fighting setuptools' auto-discovery heuristics to accept a layout that was never meant to
# be pip-installed in the first place.
[testenv]
skip_install = true
# Pass system environment variables if your CUDA drivers require them
passenv = *
deps =
    -r requirements-base.txt

commands =
    # Automatically download the required text processing data before testing
    python -c "import nltk; nltk.download('vader_lexicon'); nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('brown'); nltk.download('averaged_perceptron_tagger_eng')"
    python -m spacy download en_core_web_sm
    # Run your tests
    pytest

# Distinct profiles than Tox recognizes them and populates descriptions
[testenv:py312]
description = Run unit/integration/legacy-RAG suite locally using Python 3.12 interpreter (excludes tests/e2e -- see [testenv:e2e])
deps =
    {[testenv]deps}
    allure-pytest
    pytest-cov
commands = pytest --html=results/pytest_test_results/pytest_report.html --self-contained-html --alluredir=results/allure-results --clean-alluredir --cov=core --cov=api --cov=cli --cov=web --cov=utils --cov-report=term-missing --cov-report=html:results/coverage_html tests --ignore=tests/e2e -v

[testenv:lint]
description = Run ruff (lint) and mypy (type-check) against the live, in-scope codebase -- config in pyproject.toml excludes the untouched Neo4j subsystem (CLAUDE.md SS1) and the legacy/undecided streamlit_app* variants (CLAUDE.md SS5/SS12), matching the same scope .coveragerc already carves out. black is NOT run here -- see CLAUDE.md SS11's caveat on why it stays a manually-invoked, unformatted-baseline tool for now.
deps =
    {[testenv]deps}
    ruff==0.15.17
    mypy==2.1.0
commands =
    ruff check .
    mypy core api cli web utils

[testenv:e2e]
description = Run Playwright E2E suite (tests/e2e) in its own process -- pytest-playwright's sync driver leaves the main-thread asyncio event loop unusable for anything calling asyncio.run() afterward, so this must not share a process with py312
deps =
    {[testenv]deps}
    pytest-playwright
commands =
    playwright install chromium
    pytest tests/e2e -v

[testenv:linux]
description = Run Linux-specific test suite with localized environments
# 3. FIXED: Restrict this environment so it only executes if the host OS matches
platform = linux
deps =
    {[testenv]deps}
    -r requirements-linux.txt

[testenv:win32]
description = Run Windows-specific test suite with optimized CUDA dependencies
platform = win32
deps =
    {[testenv]deps}
    -r requirements-windows.txt
commands =
    # Windows needs the custom PyTorch URL before running tests
    pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    # Inherit core commands from the master [testenv]
    {[testenv]commands}
